devices:
  Pot:
    type: StepperI2C
    terminal: 2
    delay: 0.02
    style: SINGLE
    bounds:
      - 0
      - 2100
  colorWheel:
    type: FilterStepperI2C
    terminal: 3
    delay: 0.02
    refPoints:
      0deg: 0
      60deg: -270
      120deg: -540
      180deg: -810
      240deg: -1080
      300deg: -1350
    style: SINGLE
  densityWheel:
    type: FilterStepperI2C
    terminal: 1
    delay: 0.02
    refPoints:
      0deg: 0
      60deg: -270
      120deg: -540
      180deg: -810
      240deg: -1080
      300deg: -1350
    style: SINGLE
  Electrometer:
    type: Keithley6514Electrometer
    usbAddress: 1
    power:
      provider: PEpdu
      outlet: Electrometer
  Multimeter:
    type: Keithley2000Multimeter
    usbAddress: 0
    power:
      provider: PEpdu
      outlet: Multimeter
  PEpdu:
    type: PDUOutlet
    hostname: "pepdu.inst.physics.ucsb.edu"
    userid: "admin"
    password: ${secret:pepdu-password}
    outlets:
      - 5
      - 6
      - 7
      - 8
    outletMap:
      Electrometer: 5
      Multimeter: 6
      HgNeLamp: 7
      Ambient: 8
  HgNeLamp:
    type: PowerConsumer
    power:
      provider: PEpdu
      outlet: HgNeLamp
  Ambient:
    type: PowerConsumer
    power:
      provider: PEpdu
      outlet: Ambient
locks:
  pdu:
    - PEpdu
    - Electrometer
    - Multimeter
    - HgNeLamp
    - Ambient
  pot:
    - Pot
  colorwheel:
    - colorWheel
  densityWheel:
    - densityWheel
network:
  domain: photo1.inst.physics.ucsb.edu
  port: 8080
  wsPort: 8675
website:
  commonStaticFolder: true
  index: !path PhotoElectricEffect/zindex.html
  staticFolder: !path PhotoElectricEffect/static
